<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebRTC / PeerJS 深掘り診断</title>
<style>
  body { font-family: sans-serif; background:#0b2530; color:#f3e9d2; padding:16px; }
  button { font-size:15px; padding:9px 14px; margin:4px; }
  input { font-size:16px; padding:8px; width:110px; text-transform:uppercase; }
  .log { white-space:pre-wrap; background:rgba(255,255,255,.07); padding:10px; border-radius:8px; margin-top:8px; font-size:12.5px; line-height:1.5; }
  .big { font-size:26px; letter-spacing:3px; font-weight:bold; }
</style>
</head>
<body>
<h2>診断A：素の WebRTC ループバック（同じページ内）</h2>
<p>
  <button id="a-plain">TURNなしで開始</button>
  <button id="a-turn">TURNありで開始</button>
</p>
<div class="log" id="logA"></div>

<h2>診断B：PeerJS（内部の状態も記録）</h2>
<p>
  <button id="b-host">ホストになる</button>
  <input id="code" placeholder="CODE">
  <button id="b-guest">ゲストで接続</button>
  <span>部屋コード：<span class="big" id="mycode">----</span></span>
</p>
<div class="log" id="logB"></div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const mk = el => m => { el.textContent += `[${new Date().toLocaleTimeString()}] ${m}\n`; };
const logA = mk($("logA")), logB = mk($("logB"));
function iceCfg(turn) {
  if (!turn) return { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };
  return { iceServers: [
    { urls: "stun:stun.l.google.com:19302" },
    { urls: "turn:openrelay.metered.ca:80", username: "openrelayproject", credential: "openrelayproject" },
    { urls: "turn:openrelay.metered.ca:443", username: "openrelayproject", credential: "openrelayproject" },
    { urls: "turns:openrelay.metered.ca:443?transport=tcp", username: "openrelayproject", credential: "openrelayproject" },
  ] };
}

/* ===== 診断A ===== */
async function loopback(turn) {
  logA(`--- ループバック開始 TURN=${turn ? "あり" : "なし"} ---`);
  const cfg = iceCfg(turn);
  const pc1 = new RTCPeerConnection(cfg), pc2 = new RTCPeerConnection(cfg);
  const candType = c => { if (!c) return "（収集終了）"; const m = / typ (\w+)/.exec(c.candidate || ""); return m ? m[1] : "?"; };
  pc1.onicecandidate = e => { logA(`pc1 candidate: ${candType(e.candidate)}`); if (e.candidate) pc2.addIceCandidate(e.candidate).catch(err => logA("pc2 addIce err " + err)); };
  pc2.onicecandidate = e => { logA(`pc2 candidate: ${candType(e.candidate)}`); if (e.candidate) pc1.addIceCandidate(e.candidate).catch(err => logA("pc1 addIce err " + err)); };
  pc1.oniceconnectionstatechange = () => logA(`pc1 iceConnectionState = ${pc1.iceConnectionState}`);
  pc2.oniceconnectionstatechange = () => logA(`pc2 iceConnectionState = ${pc2.iceConnectionState}`);
  const dc = pc1.createDataChannel("test");
  dc.onopen = () => { logA("pc1 datachannel OPEN"); dc.send("hello"); };
  dc.onmessage = e => logA(`pc1 受信「${e.data}」`);
  pc2.ondatachannel = e => {
    const ch = e.channel;
    ch.onopen = () => logA("pc2 datachannel OPEN");
    ch.onmessage = ev => { logA(`pc2 受信「${ev.data}」`); ch.send("world"); };
  };
  const offer = await pc1.createOffer();
  await pc1.setLocalDescription(offer);
  await pc2.setRemoteDescription(offer);
  const answer = await pc2.createAnswer();
  await pc2.setLocalDescription(answer);
  await pc1.setRemoteDescription(answer);
  logA("offer/answer 交換完了。ICEの結果を待っています…");
  setTimeout(() => logA(`10秒後の状態： pc1=${pc1.iceConnectionState} / pc2=${pc2.iceConnectionState}`), 10000);
}
$("a-plain").addEventListener("click", () => loopback(false));
$("a-turn").addEventListener("click", () => loopback(true));

/* ===== 診断B ===== */
const PREFIX = "spellia-diag-";
const CH = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
function peerCfg() { return { config: iceCfg(false) }; }
function wireDeep(conn, role) {
  const pc = conn.peerConnection;
  logB(`${role}: peerConnection 取得 ${pc ? "OK" : "なし"}`);
  if (pc) {
    pc.oniceconnectionstatechange = () => logB(`${role}: pc.ice = ${pc.iceConnectionState}`);
    pc.onconnectionstatechange = () => logB(`${role}: pc.state = ${pc.connectionState}`);
    pc.onicegatheringstatechange = () => logB(`${role}: gathering = ${pc.iceGatheringState}`);
    pc.onsignalingstatechange = () => logB(`${role}: signaling = ${pc.signalingState}`);
    pc.onicecandidate = e => logB(`${role}: local candidate ${e.candidate ? (e.candidate.type || "?") : "（終了）"}`);
  }
  conn.on("open", () => { logB(`${role}: conn OPEN`); if (role === "guest") conn.send("ping"); });
  conn.on("data", d => logB(`${role}: data「${d}」`));
  conn.on("error", e => logB(`${role}: conn error ${e.type || e}`));
  conn.on("iceStateChanged", s => logB(`${role}: peerjs iceStateChanged ${s}`));
}
$("b-host").addEventListener("click", () => {
  let code = "";
  for (let i = 0; i < 4; i++) code += CH[Math.floor(Math.random() * CH.length)];
  $("mycode").textContent = code;
  const peer = new Peer(PREFIX + code, peerCfg());
  peer.on("open", id => logB(`host: peer open ${id}`));
  peer.on("connection", conn => { logB("host: connection イベント"); wireDeep(conn, "host"); });
  peer.on("error", e => logB(`host: peer error ${e.type}`));
});
$("b-guest").addEventListener("click", () => {
  const code = ($("code").value || "").trim().toUpperCase();
  if (code.length !== 4) { logB("guest: コード4文字"); return; }
  const peer = new Peer(peerCfg());
  peer.on("open", id => {
    logB(`guest: peer open ${id}`);
    const conn = peer.connect(PREFIX + code, { reliable: true });
    logB("guest: connect() 発行");
    wireDeep(conn, "guest");
  });
  peer.on("error", e => logB(`guest: peer error ${e.type}`));
});
logA("診断A 準備完了");
logB("診断B 準備完了。PeerJS: " + (typeof Peer !== "undefined" ? "OK" : "NG"));
</script>
</body>
</html>
