<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPELLIA ブラウザ版｜AR × ボードゲーム卒業制作</title>
<style>
  :root{
    --teal:#0d3038; --teal2:#103c46; --cream:#f3e9d2; --gold:#d4af37;
    --ink:#e9e2cf; --dim:#9db4b8; --danger:#e0655f; --good:#7ed492;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{margin:0; background:radial-gradient(1200px 700px at 50% -10%, #14505c, var(--teal) 60%);
    color:var(--ink); font-family:"Hiragino Mincho ProN","Yu Mincho",serif; min-height:100vh}
  .hidden{display:none !important}
  button{font-family:inherit; cursor:pointer}
  .wrap{max-width:860px; margin:0 auto; padding:16px 14px 40px}

  /* ===== タイトル ===== */
  #screen-title{text-align:center; padding-top:34px}
  .logo{font-size:52px; letter-spacing:.22em; color:var(--cream); margin:0}
  .logo .star{color:var(--gold)}
  .subtitle{color:var(--dim); letter-spacing:.35em; font-size:12px; margin-top:6px}
  .panel{background:rgba(0,0,0,.25); border:1px solid rgba(212,175,55,.45); border-radius:14px;
    padding:18px; margin:22px auto; max-width:560px; text-align:left}
  .panel h3{margin:0 0 10px; color:var(--gold); font-size:15px; letter-spacing:.1em}
  .opt-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px}
  .opt{border:1px solid rgba(243,233,210,.35); background:transparent; color:var(--ink);
    padding:8px 14px; border-radius:999px; font-size:14px}
  .opt.sel{background:var(--gold); color:#20303a; border-color:var(--gold); font-weight:bold}
  .start-btn{display:block; margin:8px auto 0; background:var(--gold); color:#20303a; border:none;
    font-size:19px; letter-spacing:.2em; padding:13px 44px; border-radius:999px; font-weight:bold}
  .rule-list{font-size:13px; line-height:1.9; color:var(--ink)}
  .rule-list b{color:var(--cream)}
  details{margin-top:10px} summary{cursor:pointer; color:var(--gold); font-size:13px}
  .tiny{font-size:11px; color:var(--dim); line-height:1.7}

  /* ===== ゲーム画面 ===== */
  .topbar{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px}
  .turn-badge{border:1px solid var(--gold); color:var(--gold); border-radius:999px; padding:4px 14px; font-size:13px}
  .scoreboard{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:8px; margin:14px 0}
  .score{border-radius:12px; padding:8px 10px; background:rgba(0,0,0,.28); border:2px solid transparent}
  .score .nm{font-size:13px; display:flex; justify-content:space-between; align-items:center}
  .score .pt{font-size:24px; color:var(--cream); font-weight:bold}
  .score .pt small{font-size:11px; color:var(--dim); font-weight:normal}
  .score.flipper{border-color:var(--gold)}
  .score.me{box-shadow:0 0 0 1px rgba(243,233,210,.35) inset}
  .rank{font-size:10px; padding:1px 7px; border-radius:999px; background:rgba(212,175,55,.2); color:var(--gold)}
  .pile{font-size:10px; color:var(--dim); min-height:14px; line-height:1.5}
  .dot{display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:4px; vertical-align:-1px}

  .phase-msg{text-align:center; font-size:17px; color:var(--cream); margin:8px 0 4px; min-height:26px}
  .phase-sub{text-align:center; font-size:12px; color:var(--dim); margin-bottom:10px; min-height:16px}

  .table{display:flex; justify-content:center; gap:14px; flex-wrap:wrap; margin:10px 0 6px; min-height:158px}
  .slot{text-align:center; width:104px}
  .slot .who{font-size:11px; margin-top:6px; color:var(--dim)}
  .card{width:104px; height:146px; border-radius:10px; margin:0 auto; position:relative;
    transform-style:preserve-3d; transition:transform .55s cubic-bezier(.2,.7,.3,1.2)}
  .card .face{position:absolute; inset:0; border-radius:10px; backface-visibility:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center; padding:6px}
  .card .front{background:linear-gradient(160deg,#12424e,#0a2830); border:2px solid var(--gold);
    transform:rotateY(180deg); text-align:center}
  .card .back{border:2px solid rgba(243,233,210,.5); color:var(--cream);
    background-image:radial-gradient(circle at 50% 42%, rgba(243,233,210,.16) 0 26%, transparent 27%),
      repeating-linear-gradient(45deg, rgba(243,233,210,.06) 0 6px, transparent 6px 12px)}
  .card .back .blogo{font-size:13px; letter-spacing:.18em}
  .card .back .bstar{color:var(--gold); font-size:17px}
  .card.open{transform:rotateY(180deg)}
  .card .icon{font-size:30px; line-height:1}
  .card .cname{font-size:21px; color:var(--cream); letter-spacing:.15em; margin:2px 0}
  .card .ctext{font-size:9.5px; color:var(--dim); line-height:1.5}
  .card.pending{box-shadow:0 0 18px 3px rgba(150,80,220,.75)}
  .card.tappable{cursor:pointer; animation:pulse 1.2s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(212,175,55,.0)}50%{box-shadow:0 0 14px 2px rgba(212,175,55,.55)}}
  .card.gone{opacity:.28; filter:grayscale(.6)}
  .delta{position:absolute; top:-12px; right:-8px; font-size:15px; font-weight:bold; z-index:3;
    text-shadow:0 1px 3px #000; animation:floatUp 1.4s forwards}
  @keyframes floatUp{to{transform:translateY(-16px); opacity:0}}

  .actions{display:flex; justify-content:center; gap:10px; margin:12px 0}
  .act-btn{background:var(--gold); color:#20303a; border:none; padding:11px 26px; border-radius:999px;
    font-size:15px; font-weight:bold}
  .act-btn.ghost{background:transparent; color:var(--ink); border:1px solid rgba(243,233,210,.5); font-weight:normal}
  .hand{display:flex; justify-content:center; gap:9px; flex-wrap:wrap; margin-top:8px}
  .hand .card{cursor:pointer; width:92px; height:130px; transform:none}
  .hand .card:hover{transform:translateY(-6px)}
  .hand .card .front{transform:none}
  .hand-label{text-align:center; font-size:12px; color:var(--dim); margin-top:14px}

  .log{background:rgba(0,0,0,.3); border-radius:12px; padding:10px 14px; font-size:12.5px;
    line-height:1.85; height:148px; overflow-y:auto; margin-top:16px}
  .log .hd{color:var(--gold)}
  .log .bad{color:var(--danger)} .log .nice{color:var(--good)}

  /* ===== 結果 ===== */
  #screen-result{text-align:center; padding-top:40px}
  .result-row{display:flex; justify-content:space-between; max-width:420px; margin:8px auto;
    background:rgba(0,0,0,.28); padding:10px 18px; border-radius:12px; font-size:16px}
  .result-row.win{border:1px solid var(--gold); color:var(--gold); font-weight:bold}
</style>
</head>
<body>
<div class="wrap">

  <!-- タイトル -->
  <section id="screen-title">
    <p class="logo"><span class="star">✦</span>SPELLIA<span class="star">✦</span></p>
    <p class="subtitle">MAGIC SCHOOL / BOARD GAME</p>

    <div class="panel">
      <h3>人数（あなた＋ボット）</h3>
      <div class="opt-row" id="opt-count">
        <button class="opt" data-v="3">3人</button>
        <button class="opt sel" data-v="4">4人</button>
        <button class="opt" data-v="5">5人</button>
        <button class="opt" data-v="6">6人</button>
      </div>
      <h3>めくる人の決め方</h3>
      <div class="opt-row" id="opt-mode">
        <button class="opt sel" data-v="rotate">時計回り</button>
        <button class="opt" data-v="shuffle">シャッフル周回</button>
        <button class="opt" data-v="random">ランダム</button>
      </div>
      <button class="start-btn" id="btn-start">試験開始</button>
      <details>
        <summary>ルールとカード効果を見る</summary>
        <div class="rule-list" id="rule-list"></div>
        <p class="tiny">全員同じデッキ（基本12枚、6人の時は10枚）。毎ターン、めくる人以外が1枚ずつ伏せて、めくる人が好きなだけめくって好きな所で止める（チキンレース方式）。全員がカードを置き終わったら終わり、一番ポイントが多い人の勝ち。ポイントはマイナスにもなる。</p>
      </details>
    </div>
    <p class="tiny">卒業制作「SPELLIA」ブラウザ版（ルール検証用）。実物のカードとは別に、パソコンやスマホのブラウザでそのまま遊べます。</p>
  </section>

  <!-- ゲーム -->
  <section id="screen-game" class="hidden">
    <div class="topbar">
      <span class="turn-badge" id="turn-badge">1 / 12 ターン</span>
      <span class="tiny" id="mode-label"></span>
      <button class="opt" id="btn-quit">タイトルに戻る</button>
    </div>
    <div class="scoreboard" id="scoreboard"></div>
    <p class="phase-msg" id="phase-msg"></p>
    <p class="phase-sub" id="phase-sub"></p>
    <div class="table" id="table"></div>
    <div class="actions" id="actions"></div>
    <p class="hand-label" id="hand-label"></p>
    <div class="hand" id="hand"></div>
    <div class="log" id="log"></div>
  </section>

  <!-- 結果 -->
  <section id="screen-result" class="hidden">
    <p class="logo" style="font-size:36px">試験結果</p>
    <div id="result-list" style="margin-top:22px"></div>
    <div class="actions" style="margin-top:26px">
      <button class="act-btn" id="btn-again">同じ設定でもう一度</button>
      <button class="act-btn ghost" id="btn-totitle">タイトルに戻る</button>
    </div>
  </section>

</div>

<script>
"use strict";
/* =========================================================
   SPELLIA ブラウザ版 — ゲームロジック（UIと分離してテスト可能に）
   ========================================================= */
const CARD_INFO = {
  "魔石":  {icon:"🔷", text:"めくった人 +3", n:2},
  "悪戯":  {icon:"🦊", text:"めくった人は持ち主に2P渡す", n:2},
  "暴走":  {icon:"🐎", text:"めくった人 +1して、そのターンのめくり終了", n:1},
  "祝福":  {icon:"🕊️", text:"1位は全員に1P渡す", n:1},
  "主席":  {icon:"🦅", text:"めくった人は持ち主からもらう。持ち主が今1位なら3P、ちがうなら1P", n:1},
  "使い魔":{icon:"🐈‍⬛", text:"めくった人と持ち主 +2ずつ", n:1},
  "禁術":  {icon:"🐉", text:"最後に発動。そのターンまだポイントが増えてなければ+4、増えてたら-1", n:1},
  "天秤":  {icon:"⚖️", text:"めくられたら持ち主から2Pもらう。めくられなかったら持ち主が全員から1Pずつもらう（自分のめくり番では発動しない）", n:1},
  "加護":  {icon:"🦌", text:"最下位 +2（同率なら全員+1）", n:1},
  "厄災":  {icon:"🐦‍⬛", text:"めくった人は全員に1P渡す", n:1},
};
const DECK_LIST = [];
for (const [name, info] of Object.entries(CARD_INFO)) for (let i = 0; i < info.n; i++) DECK_LIST.push(name);
function deckFor(n) {
  if (n !== 6) return DECK_LIST;
  const list = [];
  for (const [name, info] of Object.entries(CARD_INFO)) {
    const c = (name === "魔石" || name === "悪戯") ? 1 : info.n;
    for (let i = 0; i < c; i++) list.push(name);
  }
  return list;
}

const PLAYER_COLORS = ["#0f766e", "#7c3aed", "#dc2626", "#2563eb", "#d97706", "#db2777"];
const BOT_NAMES = ["ルナ", "シエル", "ノア", "ミオ", "レン"];
const MODE_LABEL = {rotate:"時計回り", shuffle:"シャッフル周回", random:"ランダム"};

function shuffled(arr, rng) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function newGame(n, mode, rng) {
  const baseDeck = deckFor(n);
  const players = [];
  for (let i = 0; i < n; i++) {
    const deck = shuffled(baseDeck, rng);
    players.push({
      idx: i, name: i === 0 ? "あなた" : BOT_NAMES[i - 1], color: PLAYER_COLORS[i],
      isBot: i !== 0, pts: 3, hand: deck.slice(0, 5), stock: deck.slice(5),
      placed: null, flippedPile: [], placedCount: 0,
    });
  }
  return {
    n, mode, rng, turn: 0, players, parent: Math.floor(rng() * n),
    deckSize: baseDeck.length, deckList: baseDeck,
    lapOrder: shuffled([...Array(n).keys()], rng), prevFlipper: -1,
    flipper: -1, flippedOwners: new Set(), pendingKinjutsu: [], gained: false,
    flipCountThisTurn: 0, over: false,
  };
}

function decideFlipper(st) {
  const n = st.n, turn = st.turn;
  if (st.mode === "rotate") return (st.parent + turn) % n;
  if (st.mode === "random") return Math.floor(st.rng() * n);
  if (st.mode === "shuffle") {
    if (turn % n === 0 && turn > 0) st.lapOrder = shuffled([...Array(n).keys()], st.rng);
    return st.lapOrder[turn % n];
  }
  return (st.parent + turn) % n;
}

/* 効果を適用し、ログ行の配列を返す。禁術は pendingKinjutsu に積むだけ */
function applyFlip(st, ownerIdx, events) {
  const F = st.players[st.flipper], O = st.players[ownerIdx], card = O.placed;
  const before = F.pts;
  const pts = () => st.players.map(p => p.pts);
  const nm = p => p.name;
  if (card === "魔石") { F.pts += 3; events.push(`${nm(F)} は魔石で +3`); }
  else if (card === "悪戯") { F.pts -= 2; O.pts += 2; events.push(`${nm(F)} は悪戯！ ${nm(O)} に2P渡した`); }
  else if (card === "祝福") {
    const mx = Math.max(...pts());
    for (const g of st.players.filter(p => p.pts === mx))
      for (const q of st.players) if (q !== g) { g.pts -= 1; q.pts += 1; }
    events.push(`祝福：1位が全員に1P渡した`);
  }
  else if (card === "主席") { const v = O.pts === Math.max(...pts()) ? 3 : 1; F.pts += v; O.pts -= v; events.push(`${nm(F)} は主席で ${nm(O)} から${v}Pもらった`); }
  else if (card === "使い魔") { F.pts += 2; O.pts += 2; events.push(`使い魔：${nm(F)} と ${nm(O)} が +2ずつ`); }
  else if (card === "禁術") { st.pendingKinjutsu.push(ownerIdx); events.push(`禁術がめくれた（最後に発動）`); return; }
  else if (card === "天秤") { F.pts += 2; O.pts -= 2; events.push(`${nm(F)} は天秤で ${nm(O)} から2Pもらった`); }
  else if (card === "加護") {
    const mn = Math.min(...pts()); const lasts = st.players.filter(p => p.pts === mn);
    if (lasts.length === 1) { lasts[0].pts += 2; events.push(`加護：最下位の ${nm(lasts[0])} が +2`); }
    else { for (const q of lasts) q.pts += 1; events.push(`加護：最下位の全員が +1`); }
  }
  else if (card === "厄災") {
    for (const q of st.players) if (q !== F) { F.pts -= 1; q.pts += 1; }
    events.push(`${nm(F)} は厄災！ 全員に1P渡した`);
  }
  if (card === "暴走") { F.pts += 1; events.push(`${nm(F)} は暴走で +1（めくり終了）`); }
  if (F.pts > before) st.gained = true;
  st.flippedOwners.add(ownerIdx);
}

/* めくり終了時：禁術→捲られなかった天秤 の順に解決 */
function settleTurn(st, events) {
  const F = st.players[st.flipper];
  for (const _ of st.pendingKinjutsu) {
    if (st.gained) { F.pts -= 1; events.push(`禁術：${F.name} はこのターンもう増えていたので -1`); }
    else { F.pts += 4; events.push(`禁術：${F.name} はこのターン無得点だったので +4！`); }
  }
  st.pendingKinjutsu = [];
  for (let k = 0; k < st.n; k++) {
    const o = (st.flipper + 1 + k) % st.n;
    if (o === st.flipper || st.flippedOwners.has(o)) continue;
    if (st.players[o].placed === "天秤") {
      for (const q of st.players) if (q.idx !== o) { q.pts -= 1; st.players[o].pts += 1; }
      events.push(`捲られなかった天秤が発動：${st.players[o].name} が全員から1Pずつもらった`);
      st.flippedOwners.add(o); // UIで公開するために印を付ける
    }
  }
}

function endTurnBookkeeping(st) {
  for (const p of st.players) {
    const didPlace = !!p.placed;
    if (p.placed && st.flippedOwners.has(p.idx)) p.flippedPile.push(p.placed);
    p.placed = null;
    if (didPlace && p.stock.length) p.hand.push(p.stock.pop());
  }
  st.prevFlipper = st.flipper;
  st.flippedOwners = new Set();
  st.gained = false;
  st.flipCountThisTurn = 0;
  st.turn += 1;
  if (st.players.every(p => p.placedCount >= st.deckSize)) st.over = true;
}

/* ===== ボットの思考 ===== */
function remainingCounts(st, ownerIdx) {
  const cnt = {};
  for (const c of st.deckList) cnt[c] = (cnt[c] || 0) + 1;
  for (const c of st.players[ownerIdx].flippedPile) cnt[c] -= 1;
  return cnt;
}
function evOf(st, ownerIdx) {
  const me = st.players[st.flipper], n = st.n;
  const ptsAll = st.players.map(p => p.pts);
  const mx = Math.max(...ptsAll), mn = Math.min(...ptsAll);
  const rem = remainingCounts(st, ownerIdx);
  const tot = Object.values(rem).reduce((a, b) => a + b, 0);
  if (tot <= 0) return 0;
  let ev = 0;
  for (const [card, c] of Object.entries(rem)) {
    if (c <= 0) continue;
    const pr = c / tot; let v = 0;
    if (card === "魔石") v = 3;
    else if (card === "悪戯") v = -2;
    else if (card === "暴走") v = 0.5;
    else if (card === "祝福") v = me.pts === mx ? -(n - 1) : 1;
    else if (card === "主席") v = st.players[ownerIdx].pts === mx ? 3 : 1;
    else if (card === "使い魔") v = 2;
    else if (card === "禁術") v = 1;
    else if (card === "天秤") v = 2;
    else if (card === "加護") v = me.pts === mn ? 2 : 0;
    else if (card === "厄災") v = -(n - 1);
    ev += pr * v;
  }
  return ev;
}
function botChoosePlace(st, idx) {
  const p = st.players[idx], hand = p.hand;
  const take = order => {
    for (const name of order) { const i = hand.indexOf(name); if (i >= 0) return hand.splice(i, 1)[0]; }
    return hand.splice(Math.floor(st.rng() * hand.length), 1)[0];
  };
  return take(["天秤", "悪戯", "厄災", "使い魔", "加護", "祝福", "禁術", "暴走", "主席", "魔石"]);
}
function botDecideFlip(st) {
  const facedown = st.players.filter(p => p.idx !== st.flipper && p.placed && !st.flippedOwners.has(p.idx)).map(p => p.idx);
  if (!facedown.length) return -1;
  let best = -1, bestEv = -Infinity;
  for (const o of facedown) { const e = evOf(st, o); if (e > bestEv) { bestEv = e; best = o; } }
  const jitter = (st.players[st.flipper].idx % 3 - 1) * 0.1;
  return bestEv > -0.35 + jitter ? best : -1;
}
</script>
<script>
"use strict";
/* =========================================================
   UI層（ブラウザでのみ動く）
   ========================================================= */
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
let st = null, selCount = 4, selMode = "rotate", busy = false;

$("rule-list").innerHTML = Object.entries(CARD_INFO)
  .map(([name, i]) => `<b>${i.icon}${name}</b>（${i.n}枚）：${i.text}`).join("<br>");

for (const [boxId, set] of [["opt-count", v => selCount = +v], ["opt-mode", v => selMode = v]]) {
  $(boxId).addEventListener("click", e => {
    const b = e.target.closest(".opt"); if (!b) return;
    [...$(boxId).children].forEach(x => x.classList.remove("sel"));
    b.classList.add("sel"); set(b.dataset.v);
  });
}
$("btn-start").addEventListener("click", () => startGame());
$("btn-again").addEventListener("click", () => startGame());
$("btn-totitle").addEventListener("click", () => showTitle());
$("btn-quit").addEventListener("click", () => showTitle());

function showTitle() {
  $("screen-title").classList.remove("hidden");
  $("screen-game").classList.add("hidden");
  $("screen-result").classList.add("hidden");
}
function startGame() {
  st = newGame(selCount, selMode, Math.random);
  $("screen-title").classList.add("hidden");
  $("screen-result").classList.add("hidden");
  $("screen-game").classList.remove("hidden");
  $("mode-label").textContent = "めくる人：" + MODE_LABEL[selMode];
  $("log").innerHTML = "";
  addLog(`<span class="hd">試験開始。</span>最初の親は ${st.players[st.parent].name}。`);
  nextTurn();
}
function addLog(html) {
  const el = $("log");
  el.innerHTML += html + "<br>";
  el.scrollTop = el.scrollHeight;
}
function ptsClass(before, after) { return after > before ? "nice" : after < before ? "bad" : ""; }

function renderScores() {
  const ptsAll = st.players.map(p => p.pts);
  const mx = Math.max(...ptsAll), mn = Math.min(...ptsAll);
  $("scoreboard").innerHTML = st.players.map(p => {
    const rank = p.pts === mx ? `<span class="rank">1位</span>` : p.pts === mn ? `<span class="rank">最下位</span>` : "";
    const pile = p.flippedPile.length ? p.flippedPile.map(c => CARD_INFO[c].icon).join("") : "―";
    return `<div class="score ${p.idx === st.flipper ? "flipper" : ""} ${p.idx === 0 ? "me" : ""}">
      <div class="nm"><span><span class="dot" style="background:${p.color}"></span>${p.name}${p.idx === st.flipper ? "（めくる人）" : ""}</span>${rank}</div>
      <div class="pt">${p.pts}<small> 点 ・ 残り${p.hand.length + p.stock.length}枚</small></div>
      <div class="pile">めくられた：${pile}</div></div>`;
  }).join("");
  $("turn-badge").textContent = `${st.turn + 1} ターン目`;
}

function cardHTML(p, faceUp) {
  const info = CARD_INFO[p.placed];
  return `<div class="card ${faceUp ? "open" : ""}" data-owner="${p.idx}">
    <div class="face back" style="background-color:${p.color}">
      <div class="bstar">✦</div><div class="blogo">SPELLIA</div><div class="bstar">✦</div>
    </div>
    <div class="face front">
      <div class="icon">${info.icon}</div><div class="cname">${p.placed}</div><div class="ctext">${info.text}</div>
    </div></div>`;
}
function renderTable(tappable) {
  $("table").innerHTML = st.players.map(p => {
    if (!p.placed) {
      if (p.idx === st.flipper) return `<div class="slot"><div class="card" style="border:1.5px dashed rgba(243,233,210,.35);display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:12px">めくる人</div><div class="who"><span class="dot" style="background:${p.color}"></span>${p.name} は置かない</div></div>`;
      return `<div class="slot"></div>`;
    }
    const opened = st.flippedOwners.has(p.idx);
    const gone = st.turnPhase === "done" && !opened;
    return `<div class="slot"><div data-slot="${p.idx}">${cardHTML(p, opened)}</div>
      <div class="who"><span class="dot" style="background:${p.color}"></span>${p.name} のカード</div></div>`;
  }).join("");
  if (tappable) {
    for (const p of st.players) {
      if (p.idx === st.flipper || st.flippedOwners.has(p.idx) || !p.placed) continue;
      const el = document.querySelector(`[data-slot="${p.idx}"] .card`);
      if (el) { el.classList.add("tappable"); el.addEventListener("click", () => humanFlip(p.idx)); }
    }
  }
  // 禁術ペンディング表示
  for (const o of st.pendingKinjutsu) {
    const el = document.querySelector(`[data-slot="${o}"] .card`);
    if (el) el.classList.add("pending");
  }
}
function renderHand(onPick) {
  const me = st.players[0];
  $("hand-label").textContent = onPick ? `あなたの手札（山札 残り${me.stock.length}枚）— 伏せるカードを1枚選んでね` : "";
  $("hand").innerHTML = onPick ? me.hand.map((c, i) => {
    const info = CARD_INFO[c];
    return `<div class="card" data-hand="${i}"><div class="face front" style="position:relative">
      <div class="icon">${info.icon}</div><div class="cname">${c}</div><div class="ctext">${info.text}</div>
    </div></div>`;
  }).join("") : "";
  if (onPick) document.querySelectorAll("[data-hand]").forEach(el =>
    el.addEventListener("click", () => humanPlace(+el.dataset.hand)));
}
function setPhase(msg, sub) { $("phase-msg").textContent = msg; $("phase-sub").textContent = sub || ""; }
function setActions(html) { $("actions").innerHTML = html || ""; }

/* ===== ターン進行 ===== */
async function nextTurn() {
  if (st.over) return showResult();
  busy = false;
  st.flipper = decideFlipper(st);
  // ボットは先に伏せる（めくる人と、もう置き終わった人は伏せない）
  for (const p of st.players) {
    if (!p.isBot) continue;
    if (p.idx !== st.flipper && p.placedCount < st.deckSize) { p.placed = botChoosePlace(st, p.idx); p.placedCount += 1; }
  }
  renderScores();
  renderTable(false);
  const me = st.players[0];
  const needPlace = me.idx !== st.flipper && me.placedCount < st.deckSize;
  if (needPlace) {
    setPhase(`${st.turn + 1}ターン目`, `めくる人：${st.players[st.flipper].name}。伏せるカードを1枚選んでね`);
    renderHand(true);
    setActions("");
  } else {
    setPhase(`${st.turn + 1}ターン目`, st.flipper === 0 ? "あなたはめくる人。カードは置かないよ" : `${st.players[st.flipper].name} がめくる人（カードは置かない）`);
    renderHand(false);
    setActions("");
    busy = true;
    await sleep(600);
    flipPhase();
  }
}
async function humanPlace(handIdx) {
  if (busy) return; busy = true;
  const me = st.players[0];
  me.placed = me.hand.splice(handIdx, 1)[0];
  me.placedCount += 1;
  renderHand(false);
  renderTable(false);
  addLog(`全員がカードを伏せた。`);
  await sleep(450);
  flipPhase();
}
async function flipPhase() {
  const F = st.players[st.flipper];
  renderScores();
  if (!F.isBot) {
    setPhase(`${F.name} のめくり番`, "他の人のカードをタップしてめくろう。好きな所で「やめる」を押してね（暴走を引くと自動で終了）");
    renderTable(true);
    setActions(`<button class="act-btn" id="btn-stop">やめる（${st.flipCountThisTurn}枚めくった）</button>`);
    $("btn-stop").addEventListener("click", () => finishFlipping());
    busy = false;
  } else {
    setPhase(`${F.name} のめくり番`, "ボットがめくっているよ…");
    renderTable(false);
    setActions("");
    await sleep(650);
    while (true) {
      const target = botDecideFlip(st);
      if (target < 0) break;
      await doFlip(target);
      await sleep(620);
      if (st.lastCard === "暴走") break;
      if (!st.players.some(p => p.placed && p.idx !== st.flipper && !st.flippedOwners.has(p.idx))) break;
    }
    finishFlipping();
  }
}
async function doFlip(ownerIdx) {
  const O = st.players[ownerIdx];
  const card = O.placed;
  st.lastCard = card;
  st.flipCountThisTurn += 1;
  const events = [];
  applyFlip(st, ownerIdx, events);
  if (card === "禁術") { /* flippedOwners には settle 後に pile へ入れるため印だけ */ st.flippedOwners.add(ownerIdx); }
  renderTable(false);
  renderScores();
  for (const e of events) addLog(e);
  if (card === "暴走") { st.lastCard = "暴走"; }
}
async function humanFlip(ownerIdx) {
  if (busy) return; busy = true;
  await doFlip(ownerIdx);
  if (st.lastCard === "暴走" || !st.players.some(p => p.placed && p.idx !== st.flipper && !st.flippedOwners.has(p.idx))) { await sleep(500); return finishFlipping(); }
  renderTable(true);
  setActions(`<button class="act-btn" id="btn-stop">やめる（${st.flipCountThisTurn}枚めくった）</button>`);
  $("btn-stop").addEventListener("click", () => finishFlipping());
  busy = false;
}
async function finishFlipping() {
  if (busy && st.players[st.flipper].isBot === false && st.finishing) return;
  st.finishing = true;
  setActions("");
  const events = [];
  settleTurn(st, events);
  renderTable(false);
  renderScores();
  for (const e of events) addLog(`<span class="hd">${e}</span>`);
  await sleep(900);
  addLog(`― ${st.turn + 1}ターン目が終わった ―`);
  endTurnBookkeeping(st);
  st.finishing = false;
  nextTurn();
}
function showResult() {
  $("screen-game").classList.add("hidden");
  $("screen-result").classList.remove("hidden");
  const order = st.players.slice().sort((a, b) => b.pts - a.pts);
  $("result-list").innerHTML = order.map((p, i) =>
    `<div class="result-row ${i === 0 ? "win" : ""}"><span>${i + 1}位　${p.name}${i === 0 ? " 👑" : ""}</span><span>${p.pts} 点</span></div>`).join("");
}
</script>
